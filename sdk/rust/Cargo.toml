[package]
name = "openviking-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["OpenViking Contributors"]
description = "Lightweight pure-async Rust HTTP SDK for OpenViking"
license = "Apache-2.0"
repository = "https://github.com/volcengine/OpenViking"
readme = "README.md"
keywords = ["openviking", "rag", "context", "sdk", "async"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

[workspace]

[lib]
name = "openviking_sdk"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bytes = "1.0"
hex = "0.4"
http = "1.1"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "json",
    "multipart",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "1.0"
tokio = { version = "1.38", default-features = false, features = [
    "fs",
    "io-util",
    "rt",
    "sync",
    "time",
] }
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "time"] }
